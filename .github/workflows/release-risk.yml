name: Release Risk Assessment
# Demo change to simulate CI/CD workflow modification
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline release tag"
        required: true
        default: "v1.0.0"
        type: string
jobs:
  assess-risk:
    name: Assess Release Risk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run ReleaseGuard
        id: releaseguard
        run: |
          python release-risk/risk_engine.py \
            --base "${{ inputs.baseline }}" \
            --target "HEAD" \
            --branch "${{ github.ref_name }}"
      - name: Create Release Risk Summary 
        run: |
            echo "# 🛡️ ReleaseGuard" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Release Risk Assessment" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Baseline | \`${{ inputs.baseline }}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Target | \`HEAD\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Risk Score | **${{ steps.releaseguard.outputs.risk_score }}/100** |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Risk Level | **${{ steps.releaseguard.outputs.risk_level }}** |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Recommendation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            LEVEL="${{ steps.releaseguard.outputs.risk_level }}"

            if [ "$LEVEL" = "LOW" ]; then
              echo "✅ Low release risk. Normal review is sufficient." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$LEVEL" = "MEDIUM" ]; then
              echo "🟡 Medium release risk. Review the identified changes before release." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$LEVEL" = "HIGH" ]; then
              echo "🟠 High release risk. Additional review is recommended before release." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "🔴 Critical release risk. Detailed review is recommended before release." >> "$GITHUB_STEP_SUMMARY"
            fi
      - name: Enforce Release Risk Gate
        run: |
          LEVEL="${{ steps.releaseguard.outputs.risk_level }}"

          if [ "$LEVEL" = "CRITICAL" ]; then
            echo "Critical release risk detected. Blocking release."
            exit 1
          elif [ "$LEVEL" = "HIGH" ]; then
            echo "::warning::High release risk detected. Additional review is required before release."
          else
            echo "Release risk level is $LEVEL. Gate passed."
          fi
